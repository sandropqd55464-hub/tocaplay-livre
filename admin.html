<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Painel TocaPlay</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js?v=55"></script>
<style>
:root{--bg:#0b1410;--card:#16251d;--card2:#1d3026;--line:#25392e;--txt:#eef5f0;--muted:#8fa89a;--green:#19c37d;--yellow:#ffd23f}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:'Outfit',system-ui,sans-serif;padding:16px;min-height:100vh}
main{max-width:1000px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;gap:10px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px}
.logo img{width:40px;height:40px;border-radius:11px}
.logo small{display:block;font-size:12px;color:var(--muted);font-weight:600}
button{font:inherit;cursor:pointer;border:0}
.btn{background:var(--green);color:#06120c;font-weight:700;padding:12px 16px;border-radius:12px}
.btn.ghost{background:transparent;color:var(--txt);border:1px solid var(--line);padding:9px 14px}
.login{max-width:380px;margin:12vh auto 0;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px}
.login h1{font-size:20px;margin-bottom:6px}.login p{color:var(--muted);font-size:14px;margin-bottom:14px}
.login input{width:100%;background:#111d17;border:1px solid var(--line);color:var(--txt);border-radius:12px;padding:13px;font-size:16px;margin-bottom:10px;font-family:inherit}
.login .btn{width:100%}
.err{color:#ff7b7b;font-size:14px;margin-top:10px;min-height:20px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.tile .n{font-size:30px;font-weight:800;margin-top:4px}
.tile .l{font-size:13px;color:var(--muted);font-weight:600}
.tile .s{font-size:12px;color:var(--muted);margin-top:2px}
.tile.hl{background:linear-gradient(135deg,#1c4a33,#16251d)}
.tile.hl .n{color:var(--yellow)}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:12px}
.box h2{font-size:16px;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:700px){.grid2{grid-template-columns:1fr}}
.chart{display:flex;align-items:flex-end;gap:3px;height:150px;border-bottom:1px solid var(--line);padding-top:16px}
.bar{flex:1;background:var(--green);border-radius:4px 4px 0 0;min-height:2px;position:relative}
.bar:hover{background:var(--yellow)}
.bar span{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font-size:10px;color:var(--muted);display:none;white-space:nowrap}
.bar:hover span{display:block}
.axis{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:4px}
.rank{list-style:none}
.rank li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.rank li:last-child{border:0}.rank b{color:var(--yellow)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--muted);font-weight:600;padding:8px 6px;border-bottom:1px solid var(--line)}
td{padding:9px 6px;border-bottom:1px solid var(--line);word-break:break-all}
.scroll{overflow-x:auto}
.fila{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.fila p{margin-top:4px;font-size:14px;white-space:pre-wrap;word-break:break-word}
.fila .fb{display:flex;gap:6px;flex:none}.fila .btn{padding:8px 12px;font-size:13px}
.muted{color:var(--muted);font-size:13px}
.empty{color:var(--muted);font-size:14px;padding:10px 0}
.hbar{display:grid;grid-template-columns:minmax(110px,40%) 1fr auto;align-items:center;gap:10px;padding:6px 0;font-size:14px}
.hbar .t{height:10px;border-radius:6px;background:#0f1d16;overflow:hidden}
.hbar .t i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--green),var(--yellow))}
.hbar b{color:var(--yellow);font-variant-numeric:tabular-nums}
.hbar span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sel{background:#111d17;color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:inherit;font-size:14px;margin-bottom:10px}
.br{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;max-width:420px}
.br div{aspect-ratio:1;border-radius:8px;display:grid;place-items:center;font-size:12px;font-weight:800;color:#06120c;position:relative}
.br div small{position:absolute;bottom:2px;font-size:9.5px;font-weight:700;opacity:.8}
.legend{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px;margin-top:8px}
.legend i{display:inline-block;width:60px;height:8px;border-radius:4px;background:linear-gradient(90deg,#1d3026,var(--green),var(--yellow))}
</style>
</head>
<body>
<main id="app"></main>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Number(n||0).toLocaleString('pt-BR');
const app=$('#app');
const ready = CONFIG.SUPABASE_URL.startsWith('https://');
const sb = ready ? supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY) : null;

function head(withLogout){
  return `<header><div class="logo"><img src="icon.svg" alt=""><div>Painel TocaPlay<small>Só você vê esta página</small></div></div>
    ${withLogout?'<div style="display:flex;gap:8px"><button class="btn ghost" id="reload">Atualizar</button><button class="btn ghost" id="out">Sair</button></div>':''}</header>`;
}

function loginView(msg=''){
  app.innerHTML = `<div class="login"><h1>🔒 Painel do dono</h1>
    <p>Entre com o mesmo e-mail e senha da sua conta no TocaPlay.</p>
    <form id="f"><input type="email" id="e" placeholder="E-mail" required autocomplete="email">
    <input type="password" id="p" placeholder="Senha" required autocomplete="current-password">
    <button class="btn" id="b">Entrar</button></form><div class="err" id="err">${esc(msg)}</div></div>`;
  $('#f').onsubmit=async ev=>{
    ev.preventDefault(); $('#b').textContent='Entrando…';
    const {error}=await sb.auth.signInWithPassword({email:$('#e').value.trim(),password:$('#p').value});
    $('#b').textContent='Entrar';
    if(error) $('#err').textContent='E-mail ou senha incorretos';
    else load();
  };
}

async function load(){
  app.innerHTML = head(true)+'<p class="muted">Carregando números…</p>';
  bind();
  const {data,error}=await sb.rpc('admin_stats');if(data)areaLimpa(data);
  if(error){
    if(String(error.message).includes('negado')){ await sb.auth.signOut(); return loginView('Esta conta não tem acesso ao painel.'); }
    app.innerHTML = head(true)+`<div class="box">Erro ao carregar: ${esc(error.message)}<p class="muted" style="margin-top:8px">Confira se você rodou o supabase.sql inteiro no SQL Editor.</p></div>`;
    return bind();
  }
  render(data);
}

function render(d){
  // completa os últimos 30 dias (dias sem acesso = 0)
  const map=Object.fromEntries((d.por_dia||[]).map(x=>[x.dia,x.acessos]));
  const days=[]; for(let i=29;i>=0;i--){ const dt=new Date(Date.now()-i*864e5); const k=dt.toISOString().slice(0,10); days.push({k,n:map[k]||0,label:dt.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})}); }
  const max=Math.max(1,...days.map(x=>x.n));
  app.innerHTML = head(true) + `
  <div class="tiles">
    <div class="tile hl"><div class="l">Visitantes reais (30 dias)</div><div class="n">${fmt(d.aparelhos_30d)}</div><div class="s">${fmt(d.visitantes_7d)} nos últimos 7 dias · ${fmt(d.visitantes_total)} desde o início</div></div>
    <div class="tile hl"><div class="l">Inscritos</div><div class="n">${fmt(d.usuarios_total)}</div><div class="s">${fmt(d.inscritos_rapidos)} com 1 toque · ${fmt(d.com_email)} com e-mail</div></div>
    <div class="tile"><div class="l">Novos inscritos (7 dias)</div><div class="n">${fmt(d.usuarios_7d)}</div></div>
    <div class="tile hl"><div class="l">Instalaram o app</div><div class="n">${fmt(d.instalacoes_total)}</div><div class="s">${fmt(d.instalacoes_7d)} nos últimos 7 dias</div></div>
    <div class="tile hl"><div class="l">Média de acessos/dia</div><div class="n">${fmt(d.media_diaria_30d)}</div></div>
    <div class="tile"><div class="l">Acessos hoje</div><div class="n">${fmt(d.acessos_hoje)}</div></div>
    <div class="tile"><div class="l">Rádios tocadas (7 dias)</div><div class="n">${fmt(d.plays_7d)}</div></div>
  </div>
  <div class="box"><h2>Acessos por dia (últimos 30 dias)</h2>
    <div class="chart">${days.map(x=>`<div class="bar" style="height:${(x.n/max*100).toFixed(1)}%"><span>${x.label}: ${x.n}</span></div>`).join('')}</div>
    <div class="axis"><span>${days[0].label}</span><span>hoje</span></div>
    <p class="muted" style="margin-top:8px">Cada pessoa (aparelho) conta 1 vez por dia, com ou sem cadastro. Robôs e buscadores não entram na conta.</p></div>
  <div class="grid2">
    <div class="box"><h2>🧭 Acesso por área (30 dias)</h2>${bars(d.por_area,'area','pessoas','pessoas')}
      <p class="muted" style="margin-top:6px">Pessoas diferentes que abriram cada área.</p></div>
    <div class="box"><h2>📈 Área por dia</h2>
      <select class="sel" id="areaSel">${[...new Set((d.area_dia||[]).map(x=>x.area))].sort().map(a=>`<option>${esc(a)}</option>`).join('')||'<option>Sem dados ainda</option>'}</select>
      <div id="areaChart"></div></div>
  </div>
  <div class="grid2">
    <div class="box"><h2>📍 De onde são (30 dias)</h2>${brMap(d.visit_estado)}
      <div class="legend">menos <i></i> mais</div>
      ${d.visit_exterior?`<p class="muted" style="margin-top:8px">+ ${fmt(d.visit_exterior)} de fora do Brasil</p>`:''}
      ${d.visit_sem_local?`<p class="muted" style="margin-top:4px">+ ${fmt(d.visit_sem_local)} sem localização (visitas de antes do mapa)</p>`:''}
      <p class="muted" style="margin-top:4px;font-size:12px">Robôs e servidores de nuvem não entram na contagem.</p></div>
    <div class="box"><h2>🏙️ Estados e cidades</h2>${bars((d.visit_estado||[]).slice(0,8),'estado','pessoas','pessoas')}
      <h2 style="margin-top:14px">Cidades</h2>${bars(d.visit_cidade,'cidade','pessoas','pessoas',x=>x.uf?` (${x.uf})`:'')}
      <p class="muted" style="margin-top:6px">Localização aproximada pela internet da pessoa. Guardamos só cidade e estado (LGPD).</p></div>
  </div>
  <div class="grid2">
    <div class="box"><h2>📺 TV mais assistida (30 dias)</h2>${list(d.top_tv,'nome','plays')}</div>
    <div class="box"><h2>🎙️ Podcasts mais ouvidos (30 dias)</h2>${list(d.top_pod,'nome','plays')}</div>
  </div>
  <div class="grid2">
    <div class="box"><h2>🔥 Rádios mais ouvidas (7 dias)</h2>${list(d.top_radios,'nome','plays')}</div>
    <div class="box"><h2>📍 Inscritos por estado</h2>${list(d.por_estado,'estado','total')}</div>
  </div>
  <div id="adsBox"></div>
  <div id="navFila"></div>
  <div class="box"><h2>📲 Instalações por aparelho</h2>${list(d.instalacoes_por_tipo,'tipo','total')}
    <p class="muted" style="margin-top:8px">Conta cada aparelho uma vez, quando o app é instalado ou aberto pelo ícone.</p></div>
  <div class="box"><h2>👥 Últimos inscritos</h2>
    ${(d.ultimos||[]).length?`<div class="scroll"><table><tr><th>Nome</th><th>E-mail</th><th>Tipo</th><th>Estado</th><th>Data</th></tr>
    ${d.ultimos.map(u=>`<tr><td>${esc(u.nome||'—')}</td><td>${esc(u.email||'—')}</td><td>${esc(u.tipo||'E-mail')}</td><td>${esc(u.estado||'—')}</td><td>${new Date(u.quando).toLocaleDateString('pt-BR')}</td></tr>`).join('')}</table></div>`
    :'<div class="empty">Ninguém se inscreveu ainda.</div>'}
  </div>
  <div class="box" id="chkBox"><h2>🔎 Verificar canais (artistas e TV)</h2><p class="muted">Confere cada canal da aba TV: se o código está certo (pelo endereço @ do canal), se a foto aparece e se o nome bate. Leva uns 2 minutos.</p><button class="btn" id="chkGo">Verificar agora</button><div id="chkOut"></div></div>
  <p class="muted" style="margin:14px 0 30px;text-align:center">Atualizado em ${new Date().toLocaleString('pt-BR')}</p>`;
  bind(); loadNavFila(); loadAds(); if($('#chkGo')) $('#chkGo').onclick=chkCanais;
  if($('#areaSel')){ $('#areaSel').onchange=()=>areaChart(d); areaChart(d); }
}
// Verificar canais: código certo pelo @ do canal, foto e nome
function nzx(t){return String(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/[^A-Z0-9 ]/g,' ').split(/\s+/).filter(w=>w.length>2&&!['OFICIAL','OFFICIAL','CANAL','THE','TV'].includes(w))}
function parecido(a,b){const A=nzx(a),B=nzx(b),ja=A.join(''),jb=B.join('');return !A.length||!B.length||A.some(w=>B.includes(w)||jb.includes(w))||B.some(w=>ja.includes(w))}
async function chkCanais(){
  const CFG=(typeof CONFIG!=='undefined'?CONFIG:window.CONFIG)||{};
  const L=(CFG.TV_CHANNELS||[]).filter(c=>c.channelId||/youtube\.com\/(@|user\/|c\/)/.test(c.url||'')),out=$('#chkOut'),R=[];let n=0;
  $('#chkGo').disabled=true;
  const um=async c=>{const hd=(String(c.url||'').match(/youtube\.com\/(@[\w.\-]+|user\/[\w.\-]+|c\/[\w.\-]+)/)||[])[1]||'';let a={},h=null;
    if(hd){try{h=await (await fetch('/api/yt?h='+encodeURIComponent(hd))).json()}catch{}}
    if(!c.channelId){const r={c,hd,nome:h&&h.name||'',foto:!!(h&&h.avatar),certo:null,prob:h&&h.id?'':'endereço não encontrado (canal novo não aparece)'};if(h&&h.id)r.ok=h.id;R.push(r);n++;out.innerHTML=`<p class="muted">Conferindo… ${n} de ${L.length}</p>`;return}
    try{a=await (await fetch('/api/yt?c='+c.channelId+(/^@/.test(hd)?'&ah='+encodeURIComponent(hd.slice(1)):''))).json()}catch{}
    const r={c,hd,nome:a.name||'',foto:!!a.avatar,certo:h&&h.id&&h.id!==c.channelId?h:null};
    r.prob=r.certo?'código errado':!a.name?'canal não encontrado':!r.foto?'sem foto':!parecido(c.name,a.name)?'nome diferente':'';
    R.push(r);n++;out.innerHTML=`<p class="muted">Conferindo… ${n} de ${L.length}</p>`};
  for(let i=0;i<L.length;i+=4) await Promise.all(L.slice(i,i+4).map(um));
  if(!L.length){$('#chkGo').disabled=false;out.innerHTML='<p class="muted">Não encontrei a lista de canais (config.js). Aperte Ctrl+F5 e tente de novo.</p>';return}
  const P=R.filter(r=>r.prob);$('#chkGo').disabled=false;
  const txt=P.map(r=>`${r.c.name} | ${r.prob} | atual ${r.c.channelId}${r.certo?' -> certo '+r.certo.id+' ('+r.certo.name+')':''}${r.nome?' | no YouTube: '+r.nome:''}${r.hd?' | '+r.hd:''}`).join('\n');
  out.innerHTML=`<p><b>${L.length} canais conferidos • ${P.length} com problema</b></p>`+(P.length?`<div class="scroll"><table><tr><th>Canal no app</th><th>Problema</th><th>No YouTube</th><th>Código certo</th></tr>${P.map(r=>`<tr><td>${esc(r.c.name)}</td><td>${esc(r.prob)}</td><td>${esc(r.nome||'—')}</td><td>${r.certo?esc(r.certo.id+' ('+r.certo.name+')'):'—'}</td></tr>`).join('')}</table></div>
   <p class="muted" style="margin-top:10px">Copie a lista abaixo e mande para o Claude corrigir:</p><textarea id="chkTxt" rows="8" style="width:100%" readonly>${esc(txt)}</textarea><button class="btn ghost" id="chkCopy">📋 Copiar lista</button>`:'<div class="empty">Todos os canais estão certos.</div>');
  if($('#chkCopy')) $('#chkCopy').onclick=()=>{navigator.clipboard.writeText(txt).then(()=>{$('#chkCopy').textContent='✓ Copiado'}).catch(()=>{$('#chkTxt').select()})};
}
// Anúncios pagos: aprovar (entra no ar) ou recusar (devolve o dinheiro pelo Mercado Pago)
async function loadAds(){
  const el=$('#adsBox'); if(!el) return;
  const {data,error}=await sb.rpc('admin_ads');
  if(error){ el.innerHTML=`<div class="box"><h2>📣 Anúncios</h2><p class="muted">Rode o SQL dos anúncios (versão 37) no Supabase para ver esta parte.</p></div>`; return; }
  const brl=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}), now=Date.now();
  const L=data.lista||[], img=p=>CONFIG.SUPABASE_URL+'/storage/v1/object/public/ads/'+p.split('/').map(encodeURIComponent).join('/');
  const fila=L.filter(a=>a.status==='em_analise');
  const ativos=L.filter(a=>a.status==='aprovado' && Date.parse(a.end_at)>now);
  const dt=d=>new Date(d).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'});
  const contato=a=>[a.whatsapp?`<a href="https://wa.me/${a.whatsapp.length<=11?'55':''}${esc(a.whatsapp)}" target="_blank" rel="noopener" style="color:var(--yellow)">WhatsApp</a>`:'', a.link?`<a href="${esc(a.link)}" target="_blank" rel="noopener" style="color:var(--yellow)">Link</a>`:''].filter(Boolean).join(' · ');
  const card=(a,btns)=>`<div class="fila"><div style="display:flex;gap:12px;align-items:flex-start"><img src="${esc(img(a.image))}" alt="" style="width:150px;aspect-ratio:16/9;object-fit:cover;border-radius:10px;flex:none">
    <div><b>${esc(a.title)}</b><p class="muted" style="margin:2px 0">${esc(a.name||'')} · ${esc(a.email||'')}<br>${a.days} dia${a.days>1?'s':''} · pago ${brl(a.paid)} · ${a.end_at?`até ${dt(a.end_at)}`:`início ${dt(a.start_at)}`}${a.renew_of?' · 🔁 renovação':''}<br>👁 ${fmt(a.views)} vistas · 👆 ${fmt(a.clicks)} cliques · ${contato(a)}</p></div></div>${btns}</div>`;
  el.innerHTML=`<div class="box"><h2>📣 Anúncios pagos</h2>
    <div class="tiles"><div class="tile hl"><div class="l">Receita do mês</div><div class="n">${brl(data.receita_mes)}</div></div>
    <div class="tile"><div class="l">Receita total</div><div class="n">${brl(data.receita_total)}</div></div>
    <div class="tile"><div class="l">No ar agora</div><div class="n">${fmt(data.no_ar)}</div></div>
    <div class="tile"><div class="l">Para revisar</div><div class="n">${fmt(data.em_analise)}</div></div>
    <div class="tile"><div class="l">Vencendo em 3 dias</div><div class="n">${fmt(data.vencendo)}</div></div></div>
    <h2 style="margin-top:16px">🛡️ Pagos, esperando sua revisão ${fila.length?`(${fila.length})`:''}</h2>
    ${fila.length?fila.map(a=>card(a,`<div class="fb"><button class="btn" data-adok="${a.id}">Aprovar</button><button class="btn ghost" data-adno="${a.id}">Recusar e devolver</button></div>`)).join(''):'<div class="empty">Nenhum anúncio esperando. 🙌</div>'}
    <h2 style="margin-top:16px">📺 No ar e agendados</h2>
    ${ativos.length?ativos.map(a=>card(a, Date.parse(a.end_at)-now<3*864e5?'<p style="color:var(--yellow);font-weight:800">⚠️ Vence em menos de 3 dias</p>':'')).join(''):'<div class="empty">Nenhum anúncio no ar.</div>'}
    <p class="muted" style="margin-top:10px">Link para mandar aos anunciantes: <a href="/anunciar.html" style="color:var(--yellow)">tocaplaylivre.com.br/anunciar.html</a></p>
  </div>`;
  el.querySelectorAll('[data-adok]').forEach(b=>b.onclick=async()=>{ b.disabled=true;
    const {error}=await sb.rpc('admin_ad_approve',{p_id:+b.dataset.adok});
    if(error){ alert('Erro: '+error.message); b.disabled=false; return; } loadAds(); });
  el.querySelectorAll('[data-adno]').forEach(b=>b.onclick=async()=>{
    if(!confirm('Recusar este anúncio e devolver o dinheiro ao cliente?')) return; b.disabled=true;
    const {data:s}=await sb.auth.getSession();
    const r=await fetch('/api/ad-refuse',{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+s.session.access_token},body:JSON.stringify({id:+b.dataset.adno})});
    const j=await r.json().catch(()=>({}));
    if(!j.ok){ alert('Não deu para recusar agora: '+(j.error||r.status)); b.disabled=false; return; }
    loadAds(); });
}
// Navegação: fila de revisão (só o que o filtro automático ou as denúncias separaram)
async function loadNavFila(){
  const el=$('#navFila'); if(!el) return;
  const {data,error}=await sb.rpc('admin_nav_fila');
  if(error){ el.innerHTML=`<div class="box"><h2>🧭 Navegação</h2><p class="muted">Rode o SQL da Navegação (versão 26) no Supabase para ver esta parte.</p></div>`; return; }
  const t=data.totais||{}, cs=data.comentarios||[], vs=data.videos||[], ps=data.posts||[];
  el.innerHTML=`<div class="box"><h2>🧭 Navegação (7 dias)</h2>
    <div class="tiles"><div class="tile"><div class="l">Visualizações</div><div class="n">${fmt(t.views_7d)}</div></div>
    <div class="tile"><div class="l">Curtidas</div><div class="n">${fmt(t.curtidas_7d)}</div></div>
    <div class="tile"><div class="l">Compartilhamentos</div><div class="n">${fmt(t.shares_7d)}</div></div>
    <div class="tile"><div class="l">Comentários</div><div class="n">${fmt(t.comentarios_7d)}</div></div>
    <div class="tile hl"><div class="l">Criadores</div><div class="n">${fmt(t.criadores)}</div><div class="s">${fmt(t.posts_7d)} posts em 7 dias</div></div>
    <div class="tile"><div class="l">Espaço usado (grátis: 1.000 MB)</div><div class="n">${fmt(t.armazenamento_mb)} MB</div><div class="s">${(t.armazenamento_mb||0)>800?'⚠️ Quase cheio':'Tranquilo'}</div></div></div>
    <h2 style="margin-top:16px">🛡️ Fila de revisão ${cs.length+vs.length+ps.length?`(${cs.length+vs.length+ps.length})`:''}</h2>
    <p class="muted" style="margin-bottom:8px">A aprovação é automática. Aqui aparece só o que o filtro separou (palavrão, link) ou o que recebeu 3 denúncias.</p>
    ${!cs.length && !vs.length && !ps.length ? '<div class="empty">Nada para revisar. 🙌</div>' : ''}
    ${ps.map(p=>`<div class="fila"><div><b>Post de ${esc(p.name||'criador')}</b> <span class="muted">${esc(p.platform)} · ${esc(p.motivo||'')}</span><p>${esc(p.title)}<br><a href="${esc(p.platform==='upload' ? CONFIG.SUPABASE_URL+'/storage/v1/object/public/posts/'+p.url : p.url)}" target="_blank" rel="noopener" style="color:var(--yellow)">${p.kind==='foto'?'Abrir a foto':'Abrir o vídeo'}</a></p></div>
      <div class="fb"><button class="btn" data-dec="post|${p.id}|1">Aprovar</button><button class="btn ghost" data-dec="post|${p.id}|0">Remover</button></div></div>`).join('')}
    ${cs.map(c=>`<div class="fila"><div><b>${esc(c.name)}</b> <span class="muted">em ${esc(c.ch||'')} · ${esc(c.motivo||'')}</span><p>${esc(c.body)}</p></div>
      <div class="fb"><button class="btn" data-dec="comentario|${c.id}|1">Aprovar</button><button class="btn ghost" data-dec="comentario|${c.id}|0">Remover</button></div></div>`).join('')}
    ${vs.map(v=>`<div class="fila"><div><b>Vídeo denunciado</b> <span class="muted">${fmt(v.denuncias)} denúncias</span>
      <p><a href="https://www.youtube.com/watch?v=${encodeURIComponent(v.target.slice(2))}" target="_blank" rel="noopener" style="color:var(--yellow)">Assistir no YouTube</a></p></div>
      <div class="fb"><button class="btn" data-dec="video|${esc(v.target)}|1">Voltar ao ar</button><button class="btn ghost" data-dec="video|${esc(v.target)}|0">Remover</button></div></div>`).join('')}
  </div>`;
  el.querySelectorAll('[data-dec]').forEach(b=>b.onclick=async()=>{
    const [tipo,id,ok]=b.dataset.dec.split('|'); b.disabled=true;
    const {error}=await sb.rpc('admin_nav_decidir',{p_tipo:tipo, p_id:id, p_aprovar:ok==='1'});
    if(error){ alert('Erro: '+error.message); b.disabled=false; return; }
    loadNavFila();
  });
}
// Acesso por área: tira cliques gravados como área (registros antigos) e junta nomes repetidos
const AREA_ALIAS={'Busca de rádios':'Rádios','Podcasts (áudio)':'Podcasts','TV · Podcasts':'Podcasts'};
const areaFora=a=>/^banner:|^Navegação · |^Criadores · /.test(a||'');
function areaLimpa(d){
  if(Array.isArray(d.por_area)){const m=new Map();d.por_area.forEach(x=>{if(areaFora(x.area))return;const a=AREA_ALIAS[x.area]||x.area;m.set(a,Math.max(m.get(a)||0,+x.pessoas||0))});
    d.por_area=[...m].map(([area,pessoas])=>({area,pessoas})).sort((a,b)=>b.pessoas-a.pessoas)}
  if(Array.isArray(d.area_dia)){const m=new Map();d.area_dia.forEach(x=>{if(areaFora(x.area))return;const a=AREA_ALIAS[x.area]||x.area,k=x.dia+'|'+a;m.set(k,{dia:x.dia,area:a,n:Math.max((m.get(k)||{}).n||0,+x.n||0)})});d.area_dia=[...m.values()]}
}
function bars(arr,k,v,unit,extra){
  if(!arr||!arr.length) return '<div class="empty">Sem dados ainda.</div>';
  const max=Math.max(1,...arr.map(x=>+x[v]||0));
  return arr.map(x=>`<div class="hbar"><span title="${esc(x[k])}">${esc(x[k])}${extra?esc(extra(x)):''}</span><div class="t"><i style="width:${((+x[v]||0)/max*100).toFixed(1)}%"></i></div><b>${fmt(x[v])}</b></div>`).join('');
}
// Mapa do Brasil em quadradinhos (cada estado na sua região)
const BR_POS={RR:[1,0],AP:[3,0],AC:[0,1],AM:[1,1],PA:[2,1],MA:[3,1],CE:[4,1],RN:[5,1],RO:[1,2],MT:[2,2],TO:[3,2],PI:[4,2],PB:[5,2],
  MS:[2,3],GO:[3,3],BA:[4,3],PE:[5,3],AL:[6,3],SP:[2,4],DF:[3,4],MG:[4,4],SE:[5,4],PR:[2,5],RJ:[4,5],ES:[5,5],SC:[2,6],RS:[2,7]};
const BR_NAME={AC:'Acre',AL:'Alagoas',AP:'Amapá',AM:'Amazonas',BA:'Bahia',CE:'Ceará',DF:'Distrito Federal',ES:'Espírito Santo',GO:'Goiás',MA:'Maranhão',MT:'Mato Grosso',MS:'Mato Grosso do Sul',MG:'Minas Gerais',PA:'Pará',PB:'Paraíba',PR:'Paraná',PE:'Pernambuco',PI:'Piauí',RJ:'Rio de Janeiro',RN:'Rio Grande do Norte',RS:'Rio Grande do Sul',RO:'Rondônia',RR:'Roraima',SC:'Santa Catarina',SP:'São Paulo',SE:'Sergipe',TO:'Tocantins'};
function brMap(rows){
  const n={}; (rows||[]).forEach(r=>{ const uf=(r.uf||'').toUpperCase() || Object.keys(BR_NAME).find(k=>BR_NAME[k]===r.estado); if(uf) n[uf]=(n[uf]||0)+(+r.pessoas||0); });
  const max=Math.max(1,...Object.values(n));
  const col=v=>{ if(!v) return '#1d3026'; const t=v/max; return t>.66?'#ffd23f':t>.33?'#7ee0a8':'#19c37d'; };
  let cells='';
  for(let r=0;r<8;r++) for(let c=0;c<7;c++){
    const uf=Object.keys(BR_POS).find(k=>BR_POS[k][0]===c&&BR_POS[k][1]===r);
    cells += uf ? `<div style="background:${col(n[uf])};${n[uf]?'':'color:#8fa89a'}" title="${BR_NAME[uf]}: ${n[uf]||0}">${uf}${n[uf]?`<small>${n[uf]}</small>`:''}</div>` : '<span></span>';
  }
  return `<div class="br">${cells}</div>`;
}
function areaChart(d){
  const el=$('#areaChart'); if(!el) return;
  const a=$('#areaSel').value, map={};
  (d.area_dia||[]).filter(x=>x.area===a).forEach(x=>map[x.dia]=x.n);
  const days=[]; for(let i=29;i>=0;i--){ const dt=new Date(Date.now()-i*864e5); const k=dt.toISOString().slice(0,10); days.push({n:map[k]||0,label:dt.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})}); }
  const max=Math.max(1,...days.map(x=>x.n));
  el.innerHTML=`<div class="chart">${days.map(x=>`<div class="bar" style="height:${(x.n/max*100).toFixed(1)}%"><span>${x.label}: ${x.n}</span></div>`).join('')}</div><div class="axis"><span>${days[0].label}</span><span>hoje</span></div>`;
}
function list(arr,k,v){
  if(!arr||!arr.length) return '<div class="empty">Sem dados ainda.</div>';
  return `<ol class="rank">${arr.map((x,i)=>`<li><span>${i+1}. ${esc(x[k])}</span><b>${fmt(x[v])}</b></li>`).join('')}</ol>`;
}
function bind(){
  const o=$('#out'); if(o) o.onclick=async()=>{ await sb.auth.signOut(); loginView(); };
  const r=$('#reload'); if(r) r.onclick=load;
}

(async()=>{
  if(!sb){ app.innerHTML = head(false)+'<div class="box">Preencha o arquivo <b>config.js</b> com os dados do Supabase para usar o painel.</div>'; return; }
  const {data}=await sb.auth.getSession();
  data.session ? load() : loginView();
})();
</script>
